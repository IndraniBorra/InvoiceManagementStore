# DEPRECATED — this file was used by AWS CodeBuild and is no longer active.
# Deployment is now handled entirely by GitHub Actions (.github/workflows/backend.yml).
# Do not run this file manually — it deploys to --stage local which does not exist.


version: 0.2
phases:
  install:
    runtime-versions:
      python: 3.12
    commands:
      - echo "Installing Serverless Framework"
      - npm install -g serverless
      - npm install -g serverless-python-requirements

  pre_build:
    commands:
      - echo "Pre-build phase"
  build:
    commands:
      - sls deploy --stage local
      - echo "Building the application"
  post_build:
    commands:
      - echo "Serverless application built successfully"
      - echo "Post-build phase"
artifacts:
  files:
    - .serverless/**
    - '**/*'
