name: Deploy Infrastructure (Terraform)

on:
  # Manual trigger only — you control when infra changes deploy
  workflow_dispatch:
    inputs:
      stage:
        description: 'Stage to deploy'
        required: true
        default: 'dev'
        type: choice
        options: [dev, prod]
      action:
        description: 'Terraform action'
        required: true
        default: 'apply'
        type: choice
        options: [plan, apply, destroy]

jobs:
  terraform:
    name: Terraform ${{ inputs.action }} (${{ inputs.stage }})
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"
          terraform_wrapper: false  # needed for clean output capture

      # Create the S3 state bucket if it doesn't exist yet
      - name: Create Terraform state bucket
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          STATE_BUCKET="smartinvoice-tf-state-${ACCOUNT_ID}"
          echo "STATE_BUCKET=${STATE_BUCKET}" >> $GITHUB_ENV

          aws s3 mb s3://${STATE_BUCKET} --region us-east-1 2>/dev/null || true
          aws s3api put-bucket-versioning \
            --bucket ${STATE_BUCKET} \
            --versioning-configuration Status=Enabled 2>/dev/null || true

      # ── Cognito ───────────────────────────────────────────────────────────────

      - name: Terraform Init (Cognito)
        working-directory: infra/cognito
        run: |
          terraform init \
            -backend-config="bucket=${STATE_BUCKET}" \
            -backend-config="key=cognito-${{ inputs.stage }}/terraform.tfstate" \
            -backend-config="region=us-east-1" \
            -reconfigure

      - name: Terraform Plan (Cognito)
        working-directory: infra/cognito
        run: terraform plan -var="stage=${{ inputs.stage }}" -out=tfplan-cognito

      - name: Terraform Apply (Cognito)
        if: inputs.action == 'apply'
        working-directory: infra/cognito
        run: terraform apply -auto-approve tfplan-cognito

      - name: Terraform Destroy (Cognito)
        if: inputs.action == 'destroy'
        working-directory: infra/cognito
        run: terraform destroy -auto-approve -var="stage=${{ inputs.stage }}"

      # After apply: capture outputs and set them as GitHub Secrets automatically
      # Requires GH_PAT secret (Personal Access Token with repo scope)
      - name: Set Cognito GitHub Secrets
        if: inputs.action == 'apply'
        working-directory: infra/cognito
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
        run: |
          POOL_ID=$(terraform output -raw cognito_pool_id)
          CLIENT_ID=$(terraform output -raw cognito_client_id)

          gh secret set COGNITO_POOL_ID --body "$POOL_ID"
          gh secret set COGNITO_CLIENT_ID --body "$CLIENT_ID"

          echo ""
          echo "Cognito secrets set successfully!"
          echo ""
          echo "COGNITO_POOL_ID   = $POOL_ID"    >> $GITHUB_STEP_SUMMARY
          echo "COGNITO_CLIENT_ID = $CLIENT_ID"  >> $GITHUB_STEP_SUMMARY
          echo ""
          echo "Update local .env files with these values for local dev:"
          echo "  backend/.env  -> COGNITO_POOL_ID / COGNITO_CLIENT_ID"
          echo "  frontend/.env -> REACT_APP_COGNITO_POOL_ID / REACT_APP_COGNITO_CLIENT_ID"
